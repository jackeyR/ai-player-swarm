# 基线计划：阶梯爬到 300 bot 并维持，用于观察各层的稳定分位数。
#
# 用法：
#   sutd -config deploy/sut.yaml          # 带三个刻意瓶颈
#   runner -plan plans/baseline.yaml
#
# 跑完把 results/<run-id>/result.json 的 histograms 与 docs/METRICS.md 的目标对比。
name: baseline
description: 基线：阶梯到 300 并发 bot，稳定 3 分钟
seed: 20261122

traffic:
  shape: step
  total_bots: 300
  rate: 4
  duration_s: 300
  steps:
    - { at_s: 0,   rate: 4 }    # 4/s 起步
    - { at_s: 20,  rate: 10 }   # 20s 后加到 10/s
    - { at_s: 60,  rate: 20 }   # 60s 后加到 20/s
    - { at_s: 120, rate: 20 }   # 平台期
  jitter: 0.08
  seed: 20261122

target:
  gateway_url: "ws://127.0.0.1:8080/ws"
  mode: ranked5v5
  client_secret: "dsh-swarm-dev-secret"
  platform: windows

behaviors:
  catalog_file: personas/default.yaml

limits:
  max_concurrent_bots: 1000
  match_wait_timeout_s: 120
  heartbeat_interval_s: 5
  room_drain_timeout_s: 120

sink:
  dir: ../results
  buffer_bytes: 1048576

sut_config: ../deploy/sut.yaml
