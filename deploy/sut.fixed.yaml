# 修复版 SUT 配置：三个刻意瓶颈全部关掉。
#
# 用法：sutd -config deploy/sut.fixed.yaml
# 目的：与 deploy/sut.yaml 用同一份负载计划各跑一次，得到「修复前后」对比曲线
#       （方案 §5.3 消融实验 / §5.5 面试第 5 题）。

metrics_addr: ":9090"
room_advertise_addr: "127.0.0.1:8090"

gateway:
  addr: ":8080"
  server_name: "swarm-sut/1-fixed"
  client_secret: "dsh-swarm-dev-secret"
  session_ttl_minutes: 30
  heartbeat_timeout_ms: 15000
  handshake_timeout_ms: 5000
  max_message_bytes: 65536

room:
  tick_rate_ms: 100
  duration_ticks: 300
  fill_timeout_ms: 5000
  empty_ttl_ms: 10000
  heartbeat_timeout_ms: 5000
  budget_ms: 16
  start_delay_ms: 0
  leak_injection: false

alloc:
  mode: ranked5v5
  # 修复 1：池子放大到 256，避免「池子空了现建」的慢路径
  pool_size: 256
  refill_interval_ms: 100
  # 修复 2：取消模拟 Redis 延迟（真实修复是拆 key + 分片，这里等价于降低单次成本）
  redis_latency_ms: 0.0
  pool_hot_key: false
  global_lock: false

match:
  mode: ranked5v5
  team_size: 5
  loop_interval_ms: 100
  initial_window: 200
  window_growth_per_sec: 100
  max_window: 1000
  starve_after_ms: 20000

redis:
  shards: 8
  latency_ms: 0.0

settlement:
  # 修复 3：结算写库异步化（这里是等价物：去掉模拟 fsync 延迟）
  fsync_ms: 0.0
