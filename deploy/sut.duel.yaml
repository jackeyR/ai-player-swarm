# 1v1 快速对局配置：给真人客户端做自测用。
#
# 为什么需要单独一份：默认是 5v5（要凑 10 个人），一个人开客户端根本匹配不上；
# 这份配置把 team_size 降到 1，于是**两个客户端就能开一局**，
# 一台机器上就能验证「真人客户端能不能跑完整个协议路径」。
#
# 用法：
#   .\bin\sutd.exe -config deploy/sut.duel.yaml
#   .\bin\client.exe -auto -matches 1 -account a1 &
#   .\bin\client.exe -auto -matches 1 -account a2
#
# 注意：只用于联调。任何性能/保真度结论都不能拿这份配置跑——它对局太短、
# 房间太小，指标没有参考价值。

metrics_addr: ":9090"
room_advertise_addr: "127.0.0.1:8090"

gateway:
  addr: ":8080"
  server_name: "swarm-sut/duel"
  client_secret: "dsh-swarm-dev-secret"
  session_ttl_minutes: 30
  heartbeat_timeout_ms: 15000
  handshake_timeout_ms: 5000
  max_message_bytes: 65536

room:
  tick_rate_ms: 100
  duration_ticks: 80          # 8 秒一局，够走到一起并打出击杀
  fill_timeout_ms: 500        # 不等满，500ms 就开局
  empty_ttl_ms: 3000
  heartbeat_timeout_ms: 5000
  budget_ms: 16
  start_delay_ms: 0
  leak_injection: false

alloc:
  mode: ranked5v5
  pool_size: 16
  refill_interval_ms: 100
  redis_latency_ms: 0.0
  pool_hot_key: false
  global_lock: false

match:
  mode: ranked5v5
  team_size: 1                # 关键：1v1
  loop_interval_ms: 50
  initial_window: 2000        # 人少时别卡窗口
  window_growth_per_sec: 500
  max_window: 4000
  starve_after_ms: 2000

redis:
  shards: 4
  latency_ms: 0.0

settlement:
  fsync_ms: 0.0
